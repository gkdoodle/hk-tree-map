<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港樹木地圖</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- MapLibre GL CSS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- Marker Cluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .loading-overlay {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-size: 13px;
            font-weight: bold;
            color: #333;
            backdrop-filter: blur(5px);
        }
        /* 頂部篩選器控制面板 */
        .filter-control {
            position: absolute;
            top: 15px;
            left: 60px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            backdrop-filter: blur(5px);
        }
        .filter-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-control select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            max-width: 280px;
            background: #fff;
        }
        /* 樹名標籤樣式 */
        .tree-label {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #2e7d32;
            border-radius: 4px;
            padding: 2px 5px;
            font-size: 10px;
            font-weight: bold;
            color: #1b5e20;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        /* 右下角按鈕群組 */
        .control-group {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .map-btn {
            background: white;
            border: none;
            padding: 10px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            color: #2e7d32;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .map-btn:hover {
            background: #f1f8e9;
            transform: translateY(-1px);
        }
        /* 左下角圖例備註與來源方塊 */
        .source-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 16px;
            font-size: 12px;
            color: #444;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            line-height: 1.6;
            max-width: 220px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">正在載入品種與樹木數據...</div>
    
    <!-- 頂部雙重篩選列 -->
    <div class="filter-control">
        <div class="filter-row">
            <label for="speciesSelect"><b>🌳 品種：</b></label>
            <select id="speciesSelect" onchange="applyFilters()">
                <option value="ALL" id="opt-all-species">全部品種 ｜ 載入中...</option>
            </select>
        </div>
        <div class="filter-row">
            <label for="typeSelect"><b>🏷️ 類型：</b></label>
            <select id="typeSelect" onchange="applyFilters()">
                <option value="ALL" id="opt-all-type">全部類型 ｜ 載入中...</option>
                <option value="OVT" id="opt-ovt">古樹名木</option>
                <option value="SWT" id="opt-swt">石牆樹</option>
                <option value="BOTH" id="opt-both">古樹名木及石牆樹</option>
                <option value="OTHER" id="opt-other">其他樹木</option>
            </select>
        </div>
    </div>

    <div id="map"></div>

    <!-- 右下角按鈕群組 -->
    <div class="control-group">
        <button class="map-btn" id="toggleLabelBtn" onclick="toggleLabels()">🏷️ 隱藏標籤</button>
        <button class="map-btn" onclick="locateUser()">📍 我的位置</button>
    </div>

    <!-- 左下角圖例備註 -->
    <div class="source-box">
        <b>📌 備註：</b><br>
        🟡 古樹名木<br>
        🟤 石牆樹<br>
        🟠 古樹名木及石牆樹<br>
        🟢 其他樹木<br>
        <hr style="border:0; border-top:1px solid #eee; margin:8px 0;">
        <b>🌲 資料來源：</b><br>
        空間數據共享平台 (CSDI) 開放數據
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <!-- Leaflet MapLibre GL Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
    <!-- Marker Cluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // 初始化地圖 (置中香港)
        var map = L.map('map', {
            renderer: L.canvas(),
            maxZoom: 22,
            maxBounds: [[180, -Infinity], [-180, Infinity]],
            maxBoundsViscosity: 1
        }).setView([22.3193, 114.1694], 12);

        // 使用 OpenFreeMap Positron 向量底圖（極簡文青風、免 API Key、中英文地名清晰）
        L.maplibreGL({
            style: 'https://tiles.openfreemap.org/styles/positron',
            attribution: '&copy; <a href="https://openfreemap.org">OpenFreeMap</a> &copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        var markersCluster = L.markerClusterGroup({ 
            chunkedLoading: true,
            disableClusteringAtZoom: 19,
            spiderfyOnMaxZoom: false,
            showCoverageOnHover: false
        });
        map.addLayer(markersCluster);

        var allMarkers = []; 
        var speciesCounts = {}; 
        var typeCounts = { ALL: 0, OVT: 0, SWT: 0, BOTH: 0, OTHER: 0 }; 
        var speciesDict = {};    
        var labelsEnabled = true; 

        // 步驟 1: 先載入 tree_species.csv 建立品種屬性字典
        Papa.parse('tree_species.csv', {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(speciesResults) {
                speciesResults.data.forEach(function(row) {
                    var sName = (row.Chinese_Name || '').trim();
                    if (sName) {
                        speciesDict[sName] = {
                            scientificName: row.Scientific_Name || '',
                            family: row['科名'] || '常見植物科',
                            origin: row['品種屬性'] || '本地 / 外來',
                            flowering: row['花期'] || '',
                            fruiting: row['果期'] || '',
                            url: row['樹木網頁'] || ''
                        };
                    }
                });
                
                // 步驟 2: 再載入點位資料 csdi_gov_trees_named.csv
                loadTreeLocations();
            },
            error: function() {
                loadTreeLocations();
            }
        });

        function loadTreeLocations() {
            Papa.parse('csdi_gov_trees_named.csv', {
                download: true,
                header: true,
                skipEmptyLines: true,
                step: function(results) {
                    var row = results.data;
                    var lat = parseFloat(row.GeometryLatitude);
                    var lng = parseFloat(row.GeometryLongitude);
                    if (!isNaN(lat) && !isNaN(lng)) {
                        var treeName = (row.Chinese_Name || '未命名樹木').trim();
                        
                        speciesCounts[treeName] = (speciesCounts[treeName] || 0) + 1;
                        typeCounts.ALL++;

                        var treeType = (row.Type || '').trim();
                        var locationName = row.Location_in_Chinese || row.Location_in_English || '不詳';
                        var treeId = row.OVTNo || row.TR_no_ || row.TMCP_ID || '';
                        var dataSource = row.Source || '空間數據共享平台 (CSDI) 開放數據';
                        
                        var speciesInfo = speciesDict[treeName] || {};
                        var sciName = row.Scientific_Name || speciesInfo.scientificName || '';
                        var familyName = speciesInfo.family || '常見植物科';
                        var originStatus = speciesInfo.origin || '本地 / 外來';
                        var flowerTime = speciesInfo.flowering ? `<p style="margin: 3px 0; font-size: 12px;"><b>花期：</b>${speciesInfo.flowering}</p>` : '';
                        var fruitTime = speciesInfo.fruiting ? `<p style="margin: 3px 0; font-size: 12px;"><b>果期：</b>${speciesInfo.fruiting}</p>` : '';
                        
                        var targetUrl = speciesInfo.url || `https://zh.wikipedia.org/wiki/${encodeURIComponent(treeName)}`;

                        let color = "#2e7d32"; 
                        let radiusSize = 5;
                        let category = "OTHER";

                        if (treeType === 'OVT') {
                            color = "#fbc02d"; 
                            radiusSize = 6;
                            category = "OVT";
                            typeCounts.OVT++;
                        } else if (treeType === 'SWT') {
                            color = "#795548"; 
                            radiusSize = 6;
                            category = "SWT";
                            typeCounts.SWT++;
                        } else if (treeType.includes('OVT') && treeType.includes('SWT')) {
                            color = "#fb8c00"; 
                            radiusSize = 7;
                            category = "BOTH";
                            typeCounts.BOTH++;
                        } else {
                            typeCounts.OTHER++;
                        }

                        var marker = L.circleMarker([lat, lng], {
                            radius: radiusSize,
                            fillColor: color,
                            color: "#ffffff",
                            weight: 1.5,
                            opacity: 1,
                            fillOpacity: 0.9
                        });

                        var idHtml = treeId ? `<p style="margin: 3px 0; font-size: 12px;"><b>樹木編號：</b>${treeId}</p>` : '';
                        var popupContent = `
                            <div style="min-width: 210px; font-family: sans-serif; line-height: 1.4;">
                                <h3 style="margin: 0 0 4px 0; color: #2e7d32; font-size: 15px;">
                                    <a href="${targetUrl}" target="_blank" style="color: #2e7d32; text-decoration: none;" title="點擊查看樹木詳細介紹">${treeName} 🔗</a>
                                </h3>
                                <p style="margin: 0 0 6px 0; font-style: italic; color: #666; font-size: 12px;">${sciName}</p>
                                <hr style="border:0; border-top:1px solid #eee; margin:6px 0;">
                                <p style="margin: 3px 0; font-size: 12px;"><b>科名：</b>${familyName}</p>
                                <p style="margin: 3px 0; font-size: 12px;"><b>品種屬性：</b>${originStatus}</p>
                                ${flowerTime}
                                ${fruitTime}
                                <p style="margin: 3px 0; font-size: 12px;"><b>地點：</b>${locationName}</p>
                                ${idHtml}
                                <hr style="border:0; border-top:1px solid #eee; margin:6px 0;">
                                <p style="margin: 3px 0; font-size: 11px; color: #555;"><b>資料來源：</b>${dataSource}</p>
                            </div>
                        `;
                        marker.bindPopup(popupContent);
                        
                        marker.bindTooltip(treeName, { 
                            direction: 'right', 
                            offset: [5, 0],
                            className: 'tree-label',
                            permanent: false 
                        });

                        marker.speciesName = treeName;
                        marker.categoryType = category;
                        allMarkers.push(marker);
                        markersCluster.addLayer(marker);
                    }
                },
                complete: function() {
                    document.getElementById('loading').style.display = 'none';
                    
                    document.getElementById('opt-all-species').textContent = `全部品種 ｜ ${typeCounts.ALL.toLocaleString()} 棵`;

                    var selectElement = document.getElementById('speciesSelect');
                    var sortedSpecies = Object.keys(speciesCounts).sort(function(a, b) {
                        return speciesCounts[b] - speciesCounts[a];
                    });

                    sortedSpecies.forEach(function(species) {
                        var count = speciesCounts[species];
                        var opt = document.createElement('option');
                        opt.value = species;
                        opt.textContent = `${species} ｜ ${count.toLocaleString()} 棵`;
                        selectElement.appendChild(opt);
                    });

                    document.getElementById('opt-all-type').textContent = `全部類型 ｜ ${typeCounts.ALL.toLocaleString()} 棵`;
                    document.getElementById('opt-ovt').textContent = `古樹名木 ｜ ${typeCounts.OVT.toLocaleString()} 棵`;
                    document.getElementById('opt-swt').textContent = `石牆樹 ｜ ${typeCounts.SWT.toLocaleString()} 棵`;
                    document.getElementById('opt-both').textContent = `古樹名木及石牆樹 ｜ ${typeCounts.BOTH.toLocaleString()} 棵`;
                    document.getElementById('opt-other').textContent = `其他樹木 ｜ ${typeCounts.OTHER.toLocaleString()} 棵`;

                    updateLabelsVisibility();
                }
            });
        }

        function updateLabelsVisibility() {
            var currentZoom = map.getZoom();
            var bounds = map.getBounds();

            allMarkers.forEach(function(marker) {
                if (markersCluster.hasLayer(marker)) {
                    if (labelsEnabled && currentZoom >= 19 && bounds.contains(marker.getLatLng())) {
                        if (!marker.isTooltipOpen()) {
                            marker.openTooltip();
                        }
                    } else {
                        if (marker.isTooltipOpen()) {
                            marker.closeTooltip();
                        }
                    }
                }
            });
        }

        function toggleLabels() {
            labelsEnabled = !labelsEnabled;
            var btn = document.getElementById('toggleLabelBtn');
            if (labelsEnabled) {
                btn.innerHTML = '🏷️ 隱藏標籤';
                btn.style.color = '#2e7d32';
            } else {
                btn.innerHTML = '🏷️ 顯示標籤';
                btn.style.color = '#666';
            }
            updateLabelsVisibility();
        }

        map.on('moveend zoomend', updateLabelsVisibility);

        function applyFilters() {
            var selectedSpecies = document.getElementById('speciesSelect').value;
            var selectedType = document.getElementById('typeSelect').value;

            markersCluster.clearLayers();
            var filteredMarkers = [];

            allMarkers.forEach(function(marker) {
                var matchSpecies = (selectedSpecies === 'ALL' || marker.speciesName === selectedSpecies);
                var matchType = (selectedType === 'ALL' || marker.categoryType === selectedType);

                if (matchSpecies && matchType) {
                    filteredMarkers.push(marker);
                }
            });

            markersCluster.addLayers(filteredMarkers);
            updateLabelsVisibility();
        }

        function locateUser() {
            if (!navigator.geolocation) {
                alert("你的瀏覽器不支援定位功能。");
                return;
            }
            navigator.geolocation.getCurrentPosition(function(position) {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;
                map.setView([lat, lng], 19);
                
                L.marker([lat, lng], {
                    icon: L.divIcon({
                        html: '<div style="background-color: #1976d2; width: 14px; height: 14px; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 5px rgba(0,0,0,0.5);"></div>',
                        className: 'user-gps-marker'
                    })
                }).addTo(map).bindPopup("<b>你在這裡！</b>").openPopup();
            }, function() {
                alert("無法取得你的 GPS 位置。");
            });
        }
    </script>
</body>
</html>
