<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港樹木地圖 HK Tree Map</title>
  <!-- MapTiler SDK CSS -->
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v4.1.0/maptiler-sdk.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- MapTiler SDK JS -->
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.1.0/maptiler-sdk.umd.min.js"></script>
  <script>
    // 請在這裡填入你的 MapTiler API Key
    maptilersdk.config.apiKey = 'YOUR_MAPTILER_API_KEY';

    const map = new maptilersdk.Map({
      container: 'map',
      style: maptilersdk.MapStyle.POSITRON, // 採用高質感的 Positron 向量地圖
      center: [114.1772, 22.3027],         // 香港中心經緯度
      zoom: 12                             // 預設縮放級別
    });
  </script>
</body>
</html>
